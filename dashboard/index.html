<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQC Migration Dashboard v2.0</title>
<!--
  PQC Migration Dashboard v2.0 (Sprint 2).
  Layout only. Every number is calculated in app.js from pqc-data.json.
  Run from this folder:  python3 -m http.server 8000
  then open http://localhost:8000/
  All data is SYNTHETIC.
-->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>PQC Migration Dashboard <span class="ver">v2.0</span></h1>
    <div class="meta" id="meta">Loading data…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="View">
    <button type="button" data-view="team">Team view</button>
    <button type="button" data-view="customer">Customer view</button>
  </nav>
</header>

<div class="toolbar" id="toolbar">
  <div class="seg" id="scope" role="group" aria-label="Scope">
    <button type="button" data-scope="customer">Customer agreement</button>
    <button type="button" data-scope="org">Whole organisation</button>
  </div>
  <label class="toggle"><input type="checkbox" id="proposed"> Include proposed contract change</label>
  <button type="button" class="btn" id="expand">Expand all</button>
  <span class="synthetic">Synthetic data</span>
</div>

<main id="app"></main>

<script src="app.js"></script>
</body>
</html>
