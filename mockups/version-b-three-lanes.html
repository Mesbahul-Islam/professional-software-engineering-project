<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQC Dashboard – Version B: Three Lanes (data-driven)</title>
<!--
  MOCKUP – Version B "Three Lanes", Sprint 2: data-driven.
  Every number and sentence is read from pqc-data.json (single source of truth).
  This file only holds layout and rendering code.
  Choose a situation in the dropdown (or ?situation=attack, see pqc-data.json) to see other values.
  Run from this folder with a local server, e.g.:  python3 -m http.server 8000
  All data is SYNTHETIC. Roles are used instead of names.
-->
<style>
  :root {
    --red: #dc2626; --amber: #d97706; --green: #16a34a;
    --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --bg: #f5f6f8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 20px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; }
  header select { font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .status { display: flex; align-items: center; gap: 10px; margin-left: auto; font-weight: 700; padding: 6px 14px; border-radius: 999px; }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; }
  .status.amber { color: #92400e; background: #fef3c7; }
  .status.red { color: var(--red); background: #fee2e2; }
  .status.green { color: #166534; background: #dcfce7; }
  .synthetic { background: #f3f4f6; color: var(--muted); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .situation-note { width: 100%; margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
  .muted { color: var(--muted); }
  .error { background: #fee2e2; color: var(--red); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; }
  .pill { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.red { background: #fee2e2; color: var(--red); } .pill.amber { background: #fef3c7; color: #92400e; } .pill.green { background: #dcfce7; color: #166534; }

  .t-red { color: var(--red); } .t-amber { color: var(--amber); } .t-green { color: var(--green); }

  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  .lane { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .lane .top { padding: 24px; border-top: 8px solid var(--c); }
  .role { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
  .q { color: var(--muted); font-size: 15px; margin: 2px 0 14px; }
  .big { font-size: 48px; font-weight: 800; line-height: 1.05; }
  .big small { font-size: 18px; font-weight: 600; color: var(--muted); }
  .line { font-size: 16px; margin-top: 6px; }
  .src { font-size: 12px; color: var(--muted); margin-top: 12px; }

  /* Dropdowns (level 2) */
  details.drop { border-top: 1px solid var(--line); }
  details.drop > summary { cursor: pointer; padding: 14px 24px; font-weight: 600; display: flex; justify-content: space-between; list-style: none; }
  details.drop > summary::after { content: "▾"; color: var(--muted); }
  details.drop[open] > summary::after { content: "▴"; }
  details.drop > summary:hover { background: #f9fafb; }
  .drop .inner { padding: 0 24px 16px; }

  /* Rows (level 3) */
  details.row { border-bottom: 1px solid #f3f4f6; padding: 10px 0; }
  details.row:last-child { border-bottom: 0; }
  details.row summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; list-style: none; font-size: 15px; }
  details.row summary > span:first-child::before { content: "▸ "; color: var(--muted); }
  details.row[open] summary > span:first-child::before { content: "▾ "; }
  details.row .body { margin: 8px 0 2px 16px; font-size: 14px; color: #374151; }
  details.row .body p { margin: 0; }
  dl { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  .explain { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .check { margin: 6px 0; font-size: 15px; }

  /* Shared trade-off */
  details.shared { margin-top: 24px; background: #fff; border: 1px dashed #9ca3af; border-radius: 16px; }
  details.shared > summary { cursor: pointer; padding: 18px 24px; font-size: 18px; font-weight: 600; list-style: none; }
  details.shared > summary::after { content: " ▾"; color: var(--muted); }
  .shared .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 24px; }
  .shared .cols > div { border-top: 4px solid; padding-top: 10px; }
  .shared .middle { margin: 16px 24px 24px; background: #f9fafb; border-radius: 10px; padding: 12px 16px; }
  .shared .question { margin: 0 24px 12px; font-weight: 600; }

  @media (max-width: 900px) { .lanes, .shared .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="title">PQC Migration Dashboard</h1>
  <span class="meta" id="meta"></span>
  <span class="synthetic">SYNTHETIC · MOCKUP B</span>
  <label class="meta">Situation
    <select id="situation" aria-label="Situation"></select>
  </label>
  <span class="status" id="overall" title=""></span>
  <p class="situation-note" id="situation-summary"></p>
</header>

<main>
  <div id="error" class="error" hidden></div>
  <section class="lanes" id="lanes"></section>

  <!-- ================= SHARED TRADE-OFF (filled from data) ================= -->
  <details class="shared">
    <summary id="decision-title"></summary>
    <p class="question" id="decision-question"></p>
    <div class="cols" id="decision-cols"></div>
    <div class="middle" id="decision-suggested"></div>
  </details>
</main>

<script>
const DATA_URL = 'pqc-data.json';
const PILL = { high: 'red', med: 'amber', low: 'green' };
const SITUATION_ALIASES = { attack: 'suspected_attack', firmware: 'firmware_window', deadline: 'deadline_pressure' };
let DATA = null;

const $ = (id) => document.getElementById(id);

// Small helper: create an element with text (textContent, no HTML injection).
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

// Situation: from ?situation=... if valid, otherwise the default in the JSON.
function currentSituation() {
  let s = new URLSearchParams(location.search).get('situation');
  s = SITUATION_ALIASES[s] || s;
  return DATA.situations.some(x => x.id === s) ? s : DATA.default_situation;
}

// Pick the value for a situation; fall back to 'default' if there is no override.
function pickStat(name, sid) {
  const values = DATA.stats[name].values;
  return values[sid] || values.default;
}
function pickReport(name, sid) {
  const byS = DATA.reports[name].by_situation;
  return byS[sid] || byS.default;
}

function renderHeader(sid) {
  const sit = DATA.situations.find(s => s.id === sid);
  const status = pickStat('overall_status', sid);
  $('title').textContent = DATA.layout.title;
  $('meta').textContent = `${DATA.meta.organisation} · as of ${sit.as_of}`;
  $('situation-summary').textContent = sit.summary;
  const pill = $('overall');
  pill.className = 'status ' + status.tone;
  pill.title = DATA.meta.status_rule;
  pill.innerHTML = '';
  pill.appendChild(el('span', 'dot'));
  pill.appendChild(document.createTextNode('Overall: ' + status.big));
}

function renderLane(lane, sid) {
  const role = DATA.roles[lane.role];
  const top = pickStat(lane.top_stat, sid);
  const box = el('div', 'lane');
  box.style.setProperty('--c', role.colour);

  const t = el('div', 'top');
  t.appendChild(el('div', 'role', role.label));
  t.appendChild(el('div', 'q', role.question));
  const big = el('div', 'big t-' + top.tone);
  big.appendChild(document.createTextNode(top.big));
  if (top.big_unit) big.appendChild(el('small', null, ' ' + top.big_unit));
  t.appendChild(big);
  t.appendChild(el('div', 'line' + (top.line_tone ? ' t-' + top.line_tone : ''), top.line));
  t.appendChild(el('div', 'src', `Source: ${top.source} · updated ${top.updated}`));
  box.appendChild(t);

  lane.drops.forEach(d => box.appendChild(renderDrop(d, sid)));
  return box;
}

function renderDrop(d, sid) {
  const det = el('details', 'drop');
  det.appendChild(el('summary', null, d.label));
  const inner = el('div', 'inner');

  if (d.type === 'report') {
    const r = pickReport(d.source, sid);
    if (r.summary) inner.appendChild(el('p', 'explain', r.summary));
    r.rows.forEach(row => inner.appendChild(renderRow(row)));
    if (r.footer) inner.appendChild(el('p', 'explain', r.footer));
  } else if (d.type === 'checks') {
    pickStat(d.stat, sid).forEach(c => {
      const p = el('p', 'check t-' + (c.failing ? 'red' : 'green'), (c.failing ? '✗ ' : '✓ ') + c.text);
      inner.appendChild(p);
    });
    if (d.note) inner.appendChild(el('p', 'explain', d.note));
  } else if (d.type === 'trend') {
    const s = pickStat(d.stat, sid);
    const first = s.trend[0];
    const last = s.trend[s.trend.length - 1];
    const wrap = el('div');
    wrap.innerHTML = trendSvg(s);
    inner.appendChild(wrap);
    inner.appendChild(el('p', 'explain',
      `${first.m} ${first.v} → ${last.m} ${last.v} · dashed line = target ${s.target}` + (d.note ? ' · ' + d.note : '')));
  }

  det.appendChild(inner);
  return det;
}

function renderRow(row) {
  const det = el('details', 'row');
  const sum = el('summary');
  sum.appendChild(el('span', null, row.title));
  if (row.level) sum.appendChild(el('span', 'pill ' + PILL[row.level], row.tag));
  else sum.appendChild(el('b', null, row.tag || ''));
  det.appendChild(sum);

  const body = el('div', 'body');
  if (row.details) {
    const dl = el('dl');
    row.details.forEach(([k, v]) => { dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); });
    body.appendChild(dl);
  }
  if (row.note) body.appendChild(el('p', null, row.note));
  det.appendChild(body);
  return det;
}

// Score trend as a small inline SVG. Scale is fixed at 50–90 points.
function trendSvg(s) {
  const W = 300, H = 110, lo = 50, hi = 90;
  const n = s.trend.length;
  const x = (i) => (n === 1 ? 0 : (i * W) / (n - 1));
  const y = (v) => H - ((v - lo) / (hi - lo)) * H;
  const pts = s.trend.map((p, i) => `${x(i)},${y(p.v)}`).join(' ');
  const labels = s.trend.map((p, i) => {
    const anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
    return `<text x="${x(i)}" y="${H + 12}" font-size="10" text-anchor="${anchor}" fill="#6b7280">${p.m}</text>`;
  }).join('');
  return `<svg width="100%" height="124" viewBox="0 0 ${W} ${H + 14}" aria-label="Readiness trend, target ${s.target}">
    <line x1="0" y1="${y(s.target)}" x2="${W}" y2="${y(s.target)}" stroke="#111827" stroke-dasharray="4 4"/>
    <polyline fill="none" stroke="#2563eb" stroke-width="3" points="${pts}"/>
    ${labels}</svg>`;
}

function renderDecision(sid) {
  const cfg = DATA.layout.decision;
  const d = pickStat(cfg.stat, sid);
  $('decision-title').textContent = cfg.label;
  $('decision-question').textContent = d.question;

  const cols = $('decision-cols');
  cols.innerHTML = '';
  d.positions.forEach(p => {
    const role = DATA.roles[p.role];
    const c = el('div');
    c.style.borderColor = role.colour;
    c.appendChild(el('b', null, role.label));
    c.appendChild(document.createElement('br'));
    c.appendChild(document.createTextNode(p.stance));
    c.appendChild(document.createElement('br'));
    c.appendChild(el('span', 'muted', p.impact));
    cols.appendChild(c);
  });

  const mid = $('decision-suggested');
  mid.innerHTML = '';
  mid.appendChild(el('b', null, 'Option suggested by the data: '));
  mid.appendChild(document.createTextNode(d.suggested));
}

function render() {
  const sid = currentSituation();
  renderHeader(sid);
  const lanes = $('lanes');
  lanes.innerHTML = '';
  DATA.layout.lanes.forEach(l => lanes.appendChild(renderLane(l, sid)));
  renderDecision(sid);
}

async function init() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
  } catch (e) {
    const box = $('error');
    box.hidden = false;
    box.textContent = 'Could not load pqc-data.json (' + e.message + '). Serve this folder with a local web server, e.g. python3 -m http.server 8000, then open http://localhost:8000/version-b-three-lanes.html';
    return;
  }

  const sel = $('situation');
  DATA.situations.forEach(s => { const o = el('option', null, s.label); o.value = s.id; sel.appendChild(o); });
  sel.value = currentSituation();
  sel.addEventListener('change', () => {
    const u = new URL(location.href);
    u.searchParams.set('situation', sel.value);
    history.replaceState(null, '', u);
    render();
  });

  render();
}

init();
</script>
</body>
</html>
